kind = "web"
previewPath = "/"
title = "Songtai Partners"
version = "1.0.0"
id = "artifacts/songtai-partners"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/songtai-partners run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/songtai-partners", "run", "build" ]
serve = "static"
publicDir = "artifacts/songtai-partners/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
